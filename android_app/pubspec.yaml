name: pockettx_app
description: PocketTX – Professional Android RC Transmitter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI & Theming
  flex_color_scheme: ^8.0.0
  google_fonts: ^6.2.1

  # Local Storage
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0
  shared_preferences: ^2.2.3

  # Code Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.4.0

  # Internationalization
  intl: ^0.19.0

  # Device Info
  device_info_plus: ^10.1.0

  # Performance / Display
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

